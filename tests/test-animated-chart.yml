name: Test animated language chart
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          image-file: images/animated-stats.svg
          colors: dark
          animated-language-chart: "true"
          language-animation-speed: "15"
          image-width: "500"
          commit-and-push: "false"
          fail-on-error: "false"
          top-icon: "none"

      - name: Assert action ran with animated chart config
        env:
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$EXIT_CODE" ]; then
              echo "FAIL: action succeeded but exit-code output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with exit-code=$EXIT_CODE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert SVG file created on success
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXIT_CODE: ${{ steps.action.outputs.exit-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "exit-code: $EXIT_CODE"
          if [ "$OUTCOME" = "success" ] && [ "$EXIT_CODE" = "0" ]; then
            if [ ! -f "$GITHUB_WORKSPACE/images/animated-stats.svg" ]; then
              echo "FAIL: expected SVG file not found at images/animated-stats.svg"
              exit 1
            fi
            echo "PASS: SVG file exists"
            # Verify it's an SVG
            if ! head -c 500 "$GITHUB_WORKSPACE/images/animated-stats.svg" | grep -qi "svg"; then
              echo "FAIL: file does not appear to be an SVG"
              exit 1
            fi
            echo "PASS: file is an SVG"
          else
            echo "SKIP: action did not succeed with exit-code=0, skipping file check"
          fi
