name: international samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:

    runs-on: ubuntu-latest
      
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        ref: samples

    - name: Sample German
      uses: cicirello/user-statistician@36500351ea14b69e68217d4c89eb0f3f06680b17 # v1
      with:
        colors: light
        locale: de
        image-file: images/de.svg
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

    - name: Sample Italian
      uses: cicirello/user-statistician@36500351ea14b69e68217d4c89eb0f3f06680b17 # v1
      with:
        colors: dark
        locale: it
        image-file: images/it.svg
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
